<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGF/TikZ manual, typeset in the browser</title>
<meta name="description" content="Every page of the PGF/TikZ manual, typeset in the browser by mp-tikz-wasm and rendered as SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eceef4; --panel:#ffffff; --paper:#ffffff; --ink:#191c24; --muted:#5d637a;
    --line:#d7dbe6; --accent:#3a4ee0; --accent-ink:#ffffff; --track:#c7ccdd;
    --shadow:0 6px 28px rgba(28,32,64,.18); --paper-edge:#e7e9f0;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#0f1117; --panel:#181b22; --paper:#ffffff; --ink:#e9ebf3; --muted:#9aa1b6;
    --line:#282c37; --accent:#93a2ff; --accent-ink:#0f1117; --track:#2f3444;
    --shadow:0 8px 34px rgba(0,0,0,.5); --paper-edge:#c9ccd6; } }
  :root[data-theme="dark"]{
    --bg:#0f1117; --panel:#181b22; --paper:#ffffff; --ink:#e9ebf3; --muted:#9aa1b6;
    --line:#282c37; --accent:#93a2ff; --accent-ink:#0f1117; --track:#2f3444;
    --shadow:0 8px 34px rgba(0,0,0,.5); --paper-edge:#c9ccd6; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;min-height:100vh}
  img{max-width:100%}
  [hidden]{display:none!important}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
  header h1{font-size:1.02rem;font-weight:700;margin:0;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:.82rem;line-height:1.4;max-width:64ch}
  header .badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:20px 16px 8px;overflow:auto;gap:10px}
  .stage{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px;
    box-shadow:var(--shadow);max-width:100%;line-height:0;transition:opacity .12s ease}
  .stage img{display:block;max-width:100%;height:auto;border-radius:3px}
  .stage.loading{opacity:.35}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:#8a8f9e;font-family:var(--mono);font-size:.8rem;line-height:1.4;text-align:center;padding:24px}
  .stage.blank{width:min(520px,86vw);aspect-ratio:1/1.414}
  .stage.blank .overlay{display:flex}
  .caption{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
  footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
  .track{width:min(760px,100%);height:5px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}
  .track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px;width:0}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  button{font-family:var(--sans);font-size:.9rem;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;line-height:1;min-width:40px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4;cursor:default;color:var(--muted);border-color:var(--line)}
  .jump{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
  .jump input{font-family:var(--mono);font-size:.9rem;width:5em;text-align:center;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-variant-numeric:tabular-nums}
  .jump input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pos{font-family:var(--mono);font-size:.8rem;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pos b{color:var(--accent);font-weight:500}
  .snap{font-family:var(--mono);font-size:.72rem;color:var(--accent);min-height:1em}
  .keys{color:var(--muted);font-size:.72rem;font-family:var(--mono)}
  @media (max-width:520px){ header h1{font-size:.95rem} .keys{display:none} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <h1>PGF/TikZ manual, typeset in the browser</h1>
  <span class="badge">mp-tikz-wasm</span>
  <span class="sub" id="sub">Every page of the PGF/TikZ manual, each typeset by pdf&thinsp;TeX and dvisvgm compiled to WebAssembly and rendered as SVG &mdash; byte-identical to TeX&nbsp;Live&nbsp;2025.</span>
</header>

<main>
  <div class="stage" id="stage">
    <img id="page" alt="">
    <div class="overlay">This page is blank in the manual.</div>
  </div>
  <div class="caption" id="caption"></div>
</main>

<footer>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="bar">
    <button id="first" title="First (Home)" aria-label="First page">&#x27EA;</button>
    <button id="prev"  title="Previous (&larr;)" aria-label="Previous page">&#x2039;</button>
    <span class="jump">page
      <input id="num" type="number" min="1" inputmode="numeric" aria-label="Go to page">
      <span id="of">of &hellip;</span>
    </span>
    <button id="next" title="Next (&rarr;)" aria-label="Next page">&#x203A;</button>
    <button id="last" title="Last (End)" aria-label="Last page">&#x27EB;</button>
    <span class="keys">&larr; &rarr; to page &middot; Home / End</span>
  </div>
  <div class="pos" id="pos">loading&hellip;</div>
  <div class="snap" id="snap"></div>
</footer>

<script>
  const pad = n => String(n).padStart(4, '0');
  const $ = id => document.getElementById(id);
  const stage = $('stage'), img = $('page'), caption = $('caption'), pos = $('pos'),
        snap = $('snap'), num = $('num'), fill = $('fill');
  let PAGES = [], TOTAL = 0, idx = 0;

  function nearestIndex(target){
    let best = 0, bd = Infinity;
    for (let i = 0; i < PAGES.length; i++){ const d = Math.abs(PAGES[i] - target); if (d < bd){ bd = d; best = i; } }
    return best;
  }
  function preload(i){ if (i >= 0 && i < PAGES.length){ const im = new Image(); im.src = 'pages/' + pad(PAGES[i]) + '.svg'; } }

  function show(i, requested){
    idx = Math.max(0, Math.min(PAGES.length - 1, i));
    const p = PAGES[idx];
    stage.classList.add('loading'); stage.classList.remove('blank');
    img.alt = 'PGF/TikZ manual, page ' + p;
    img.src = 'pages/' + pad(p) + '.svg';
    num.value = p;
    pos.innerHTML = 'manual page <b>' + p + '</b> of ' + TOTAL;
    caption.textContent = 'pages/' + pad(p) + '.svg';
    fill.style.width = (TOTAL > 1 ? (p - 1) / (TOTAL - 1) * 100 : 0) + '%';
    snap.textContent = (requested != null && requested !== p) ? ('nearest available page to ' + requested) : '';
    $('first').disabled = idx === 0; $('prev').disabled = idx === 0;
    $('last').disabled = idx === PAGES.length - 1; $('next').disabled = idx === PAGES.length - 1;
    preload(idx + 1); preload(idx - 1);
  }
  img.addEventListener('load', () => { stage.classList.remove('loading'); stage.classList.toggle('blank', img.naturalWidth === 0); });
  img.addEventListener('error', () => { stage.classList.remove('loading'); });

  $('first').onclick = () => show(0);
  $('last').onclick  = () => show(PAGES.length - 1);
  $('prev').onclick  = () => show(idx - 1);
  $('next').onclick  = () => show(idx + 1);
  function goto(){ const v = parseInt(num.value, 10); if (!isNaN(v)){ const t = Math.max(1, Math.min(TOTAL, v)); show(nearestIndex(t), t); } }
  num.addEventListener('change', goto);
  num.addEventListener('keydown', e => { if (e.key === 'Enter'){ goto(); num.blur(); } });
  addEventListener('keydown', e => {
    if (e.target === num) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ show(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ show(idx - 1); e.preventDefault(); }
    else if (e.key === 'Home'){ show(0); e.preventDefault(); }
    else if (e.key === 'End'){ show(PAGES.length - 1); e.preventDefault(); }
  });

  fetch('manifest.json')
    .then(r => r.json())
    .then(m => {
      TOTAL = m.total; PAGES = m.pages && m.pages.length ? m.pages : Array.from({ length: TOTAL }, (_, i) => i + 1);
      num.max = TOTAL; $('of').textContent = 'of ' + TOTAL;
      if (PAGES.length < TOTAL) $('sub').innerHTML += ' <em>Showing ' + PAGES.length + ' pages available in this deployment.</em>';
      show(0);
    })
    .catch(() => { pos.textContent = 'Could not load manifest.json — run scripts/build-manual-viewer.mjs to stage the pages.'; });
</script>
</body>
</html>
