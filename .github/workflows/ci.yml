name: ci
on: [push, pull_request]
jobs:
  native:
    # L0: tangle, native build, contract harness; needs a TeX Live for plain.mp and fonts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: TeX Live (oracle)
        run: sudo apt-get update && sudo apt-get install -y texlive-metapost texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-pictures texlive-latex-extra texlive-luatex lmodern dvisvgm
      - name: cached TeX Live source tarball
        uses: actions/cache@v4
        with:
          path: vendor/downloads
          key: texlive-source-${{ hashFiles('vendor/SOURCES.lock') }}
      - name: vendor
        run: ./scripts/extract-vendor.sh && ./scripts/verify-pin.sh
      - name: contract harness
        run: make contract
      - name: unit tests (scanner vs the C mpto oracle; the e2e tests need the wasm job's build)
        run: npm ci && npx vitest run test/unit
  wasm:
    # About 9 minutes warm. The step limits below matter more: a TeX run stuck in a
    # synchronous wasm loop blocks vitest's own timers too, so without them a hung
    # test waits for GitHub's six-hour default (session 11 lost 15 minutes to one).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 6.0.9 }
      # The texmf tree is copied from TeX Live 2025, the release the engines are
      # built from, not from Ubuntu's TeX Live 2023: luaotfload only works with
      # its own LuaTeX, and under the 2023 packages the opentype bundle could not
      # be built or tested. The packages build-texmf copies come from the frozen
      # historic tlnet-final (scripts/ci-install-texlive.sh); cached, as they
      # never change.
      - name: cached TeX Live 2025 packages
        uses: actions/cache@v4
        with:
          path: ~/texlive-2025
          key: texlive-2025-final-${{ hashFiles('scripts/ci-install-texlive.sh') }}
      - name: TeX Live 2025 (texmf sources)
        run: ./scripts/ci-install-texlive.sh ~/texlive-2025 && ls -d ~/texlive-2025/bin/* >> "$GITHUB_PATH"
      - name: cached TeX Live source tarball
        uses: actions/cache@v4
        with:
          path: vendor/downloads
          key: texlive-source-${{ hashFiles('vendor/SOURCES.lock') }}
      - name: vendor
        run: ./scripts/extract-vendor.sh
      - name: mplib.wasm
        run: make wasm && ./scripts/check-nosystem.sh dist/mplib.wasm
      - name: native web2c pass + tex.wasm
        run: ./scripts/native-texlive.sh && ./scripts/build-tex-wasm.sh
      - name: dvisvgm.wasm
        run: ./scripts/native-dvisvgm.sh && ./scripts/build-dvisvgm-wasm.sh
      - name: luatex.wasm (native LuaTeX build recorded, then replayed with emcc)
        run: ./scripts/native-luatex.sh && ./scripts/build-luatex-wasm.sh
      # the TypeScript comes before the bundles: make-fontdb runs the wasm LuaTeX
      # through dist/ to prebuild luaotfload's name database for the opentype bundle
      - name: texmf, formats, TypeScript, font database, bundles, hot lists
        run: ./scripts/build-texmf.sh && node scripts/make-formats.mjs && npm ci && npm run build:ts && node scripts/make-fontdb.mjs && node scripts/build-bundles.mjs && node scripts/make-hotlists.mjs
      - name: end-to-end tests (API, memory, prefetch)
        timeout-minutes: 10
        run: npx vitest run test/e2e
      # MetaPost golden output is reproducible from the pinned mplib and the
      # Computer Modern fonts, so it is checked here against the committed
      # TeX Live 2025 expectations. The LaTeX/TikZ golden tracks exact package
      # versions: its expectations come from the owner's TeX Live 2025 install
      # (a May 2025 snapshot), while this runner gets the final 2025 packages, so
      # it is a dev gate run before committing expectations. It runs below for
      # information only. The e2e step above exercises the LaTeX/TikZ and
      # OpenType pipelines for behaviour.
      - name: MetaPost golden corpus vs the committed TeX Live 2025 expectations
        timeout-minutes: 5
        run: node scripts/golden.mjs --check
      - name: TikZ golden (informational; package versions differ from the dev machine's)
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/golden-tikz.mjs --check
