name: ci
on: [push, pull_request]
jobs:
  native:
    # L0: tangle, native build, contract harness; needs a TeX Live for plain.mp and fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: TeX Live (oracle)
        run: sudo apt-get update && sudo apt-get install -y texlive-metapost texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-pictures texlive-latex-extra dvisvgm
      - name: vendor
        run: ./scripts/extract-vendor.sh && ./scripts/verify-pin.sh
      - name: contract harness
        run: make contract
      - name: unit tests (scanner vs the C mpto oracle)
        run: npm ci && npm test
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 6.0.9 }
      - name: TeX Live (oracle + texmf sources)
        run: sudo apt-get update && sudo apt-get install -y texlive-metapost texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-pictures texlive-latex-extra dvisvgm
      - name: vendor
        run: ./scripts/extract-vendor.sh
      - name: mplib.wasm
        run: make wasm && ./scripts/check-nosystem.sh dist/mplib.wasm
      - name: native web2c pass + tex.wasm
        run: ./scripts/native-texlive.sh && ./scripts/build-tex-wasm.sh
      - name: dvisvgm.wasm
        run: ./scripts/native-dvisvgm.sh && ./scripts/build-dvisvgm-wasm.sh
      - name: texmf, formats, bundles, TypeScript
        run: ./scripts/build-texmf.sh && node scripts/make-formats.mjs && node scripts/build-bundles.mjs && npm ci && npm run build:ts
      - name: golden corpus vs the oracle (MetaPost, then LaTeX/TikZ)
        run: node scripts/golden.mjs && node scripts/golden-tikz.mjs
