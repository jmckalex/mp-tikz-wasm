# The pinned Ghostscript build behind the opt-in `ghostscript` bundle.
# scripts/vendor-ghostscript.sh copies these files from the Ghostscript port
# (GS_DIR, default ~/Source/ghostscript: Ghostscript 10.08.0 built to wasm by
# its own project) into vendor/ghostscript/ and refuses any whose sha256
# differs. The port is its own repository; this file is what pins it here.
